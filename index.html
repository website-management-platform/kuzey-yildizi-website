    <script>
      try { if (sessionStorage.getItem('kytd_splash')) document.documentElement.classList.add('no_splash') } catch (e) {}
    </script>
    <style>
      #splash { position: fixed; inset: 0; z-index: 9999; display: grid; place-items: center; background: #fff; transition: opacity .55s ease, visibility .55s; }
      #splash.is_hidden { opacity: 0; visibility: hidden; }
      .no_splash #splash { display: none; }
      #splash .splash_box { position: relative; width: 148px; height: 148px; display: grid; place-items: center; transition: transform .55s ease; }
      #splash.is_hidden .splash_box { transform: scale(1.12); }
      #splash img { width: 108px; height: 108px; animation: splash_pop 1.8s ease-in-out infinite; }
      #splash i { position: absolute; inset: 0; border-radius: 50%; border: 3px solid rgba(107, 18, 48, .12); border-top-color: #6b1230; border-right-color: #1d9bd8; animation: splash_spin 1.1s linear infinite; }
      @keyframes splash_pop { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.07); } }
      @keyframes splash_spin { to { transform: rotate(360deg); } }
      @media (prefers-reduced-motion: reduce) { #splash img, #splash i { animation: none; } }
    </style>
  </head>
  <body>
    <div id="splash" aria-hidden="true"><div class="splash_box"><img src="/images/brand/logo_192.png" alt="" width="108" height="108" /><i></i></div></div>
